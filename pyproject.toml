[project]
name = "videoservice"
version = "0.4.1"
description = "Client tạo ảnh/video qua dịch vụ riêng"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "mcp>=2.3,<3"]

[project.scripts]
videoservice-mcp = "videoservice.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
